name: Blueprint updates
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: blueprint-update
  cancel-in-progress: false
jobs:
  prepare:
    # Setup replaces the placeholders with the verified source.
    uses: BLUEPRINT_OWNER/BLUEPRINT_REPO/.github/workflows/adopt-release.yml@main
    with:
      source-repository: BLUEPRINT_OWNER/BLUEPRINT_REPO
      updater-ref: main
